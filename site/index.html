<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0d0e10" />

    <title>Glovebox · GTA V / PS5</title>
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="preload"
      href="./assets/fonts/barlow-condensed-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"

  <body>
    <a class="skip" href="#main">Skip to guide</a>
    <header class="appbar">
      <a class="brand" href="#/play">GLOVEBOX<span>GTA V / PS5</span></a>
      <nav class="tabs" aria-label="Main navigation">
        <a href="#/play" data-nav="play">Play</a
        ><a href="#/cheats" data-nav="cheats">Cheats</a
        ><a href="#/stores" data-nav="stores">Places</a
        ><a href="#/money" data-nav="money">Money</a
        ><a href="#/progress" data-nav="progress">100%</a>
      </nav>
      <div class="app-tools">
        <button
          data-action="search"
          aria-label="Search everything"
          title="Search everything (/)"
          class="icon-button"
        >
          ⌕</button
        ><button
          data-action="settings"
          aria-label="Settings and backup"
          title="Settings and backup"
          class="icon-button"
        >
          ☷
        </button>
      </div>
    </header>
    <div id="storage-warning" class="warning" role="status" hidden></div>
    <div id="runtime-error" class="warning" role="alert" hidden>
      The guide could not finish loading or an action failed.
      <a href="./">Reload</a> or use the

        href="https://www.gtabase.com/grand-theft-auto-v/gta-5-cheats-ps5-ps4-ps3-cheat-codes"
        >GTA Base cheat list</a
      >.
    </div>
    <main id="main" tabindex="-1">
      <div id="app">
        <div class="loading">
          <h1>Opening Glovebox…</h1>
          <p>
            If this stays on screen, <a href="./">reload</a> or open the
            <a

              >GTA Base cheat list</a
            >.
          </p>
        </div>
      </div>
      <noscript
        ><p>
          Enable JavaScript to use the guide, or open the
          <a
            href="https://www.gtabase.com/grand-theft-auto-v/gta-5-cheats-ps5-ps4-ps3-cheat-codes"
            >GTA Base cheat list</a
          >
          and
          <a
            href="https://www.gosunoob.com/grand-theft-auto-5/gta-5-stores-places-you-can-rob/"
            >original store map</a
          >.
        </p></noscript
      >
    </main>
    <div id="session" class="session" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div
      id="announcement"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-bar">
        <h2 id="sheet-title"></h2>
        <button data-action="close-sheet" aria-label="Close dialog">✕</button>
      </div>
      <div id="sheet-body"></div>
    </dialog>
    <dialog id="big" class="big" aria-labelledby="big-title"></dialog>
  </body>
</html>
